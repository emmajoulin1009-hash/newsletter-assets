  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 14px 0;"><tr><td bgcolor="#ffffff" style="background-color:#ffffff;padding:24px 28px;border-left:3px solid #0B1B3F;">
    <h3 style="font-family: 'Switzer', 'Aptos Display','Aptos','Inter',Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;color:#0B1B3F;margin:0 0 8px 0;line-height:1.35;">&ldquo;Momentum has bled two weeks in a row. This isn't a dip, it's a regime.&rdquo;</h3>
    <p class="body-text" style="font-family:'Inter',Helvetica,Arial,sans-serif;font-size:14.5px;color:#3A3F47;margin:0;line-height:1.65;">Advisors are calling it a payrolls-shock one-off. Parallax says otherwise: Momentum long/short &minus;4.2% in France, &minus;2.2% in Germany &mdash; two consecutive weeks of regime signal. The client with AI/growth concentration hasn't felt it yet. They will.</p>
  </td></tr></table>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 14px 0;"><tr><td bgcolor="#ffffff" style="background-color:#ffffff;padding:24px 28px;border-left:3px solid #0B1B3F;">
    <h3 style="font-family: 'Switzer', 'Aptos Display','Aptos','Inter',Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;color:#0B1B3F;margin:0 0 8px 0;line-height:1.35;">&ldquo;Kevin Warsh at the Fed changes the signal, not just the voice.&rdquo;</h3>
    <p class="body-text" style="font-family:'Inter',Helvetica,Arial,sans-serif;font-size:14.5px;color:#3A3F47;margin:0;line-height:1.65;">Warsh is a known critic of forward guidance. The new Fed is more data-reactive, less telegraphic. Clients positioned around rate-cut timelines are relying on a dot-plot that no longer anchors the way it did. Faster reaction function = faster repricing in both directions.</p>
  </td></tr></table>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px 0;"><tr><td bgcolor="#ffffff" style="background-color:#ffffff;padding:24px 28px;border-left:3px solid #0B1B3F;">
    <h3 style="font-family: 'Switzer', 'Aptos Display','Aptos','Inter',Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;color:#0B1B3F;margin:0 0 8px 0;line-height:1.35;">&ldquo;The peace-deal trade is a real-rates event, not just a geopolitical one.&rdquo;</h3>
    <p class="body-text" style="font-family:'Inter',Helvetica,Arial,sans-serif;font-size:14.5px;color:#3A3F47;margin:0;line-height:1.65;">Clients see ceasefire as risk-on. The real implication is disinflationary: Iranian barrels back in market, Brent toward \$80, oil CPI component falls, door reopens to rate cuts. The same peace deal that lifts equities now could flip the playbook from defensives to duration by H2. Walk clients through both legs.</p>
  </td></tr></table>

  <h2 style="font-size:24px;font-weight:700;color:#0B1B3F;margin:0 0 24px 0;line-height:1.25;">The Headlines That Moved the Tape</h2>
  <h3 style="font-size:16px;font-weight:700;color:#0B1B3F;margin:0 0 10px 0;">US Strikes Iran a Second Day; Oil Jumps, Stocks Slide</h3>
  <p style="font-size:14px;color:#3A3F47;margin:0 0 10px 0;line-height:1.55;">US strikes on Iran ran a second day on 10 June; the S&amp;P fell <strong>&minus;1.6%</strong> and the Nasdaq <strong>&minus;2%</strong> as Iran retaliated against US facilities in Bahrain, Jordan and Kuwait. Brent jumped above <strong>~\$96</strong> with the Strait of Hormuz near-closed, and US crude stocks fell 7.2M bbl, a seventh straight draw. Risk-off flows favored defensives.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 22px 0;"><tr>
    <td width="3" bgcolor="#0B1B3F" style="width:3px;line-height:1px;font-size:1px;">&nbsp;</td>
    <td style="padding:2px 0 2px 14px;"><p style="font-size:13.5px;color:#3A3F47;margin:0;line-height:1.55;"><strong style="color:#0B1B3F;">Portfolio impact:</strong> An unhedged energy or transport tilt swings with every Hormuz headline; the FOMC meets 16&ndash;17 June, so a rate-sensitive book sits in the path.</p></td>
  </tr></table>
  <h3 style="font-size:16px;font-weight:700;color:#0B1B3F;margin:0 0 10px 0;">CPI Runs Hot at 4.2%, but Core Cools to 2.9%</h3>
  <p style="font-size:14px;color:#3A3F47;margin:0 0 10px 0;line-height:1.55;">May CPI rose <strong>+0.5% MoM / +4.2% YoY</strong>, the hottest since April 2023, with energy roughly 60% of the rise. Core cooled to <strong>+0.2% MoM / +2.9% YoY</strong>, below the 0.3% estimate. Higher-for-longer stays intact into the 16&ndash;17 June FOMC.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 22px 0;"><tr>
    <td width="3" bgcolor="#0B1B3F" style="width:3px;line-height:1px;font-size:1px;">&nbsp;</td>
