  &lt;h2 class=&quot;h2-mob&quot; style=&quot;font-family:&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;color:#0B1B3F;margin:0 0 24px 0;letter-spacing:-0.015em;line-height:1.25;&quot;&gt;Three moves that reshaped the factor map.&lt;/h2&gt;

  &lt;h3 style=&quot;font-family:&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#0B1B3F;margin:0 0 10px 0;&quot;&gt;US strikes Iran a second day; stocks sell off, oil jumps&lt;/h3&gt;
  &lt;p style=&quot;font-family:&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;font-size:14px;color:#3A3F47;margin:0 0 10px 0;line-height:1.55;&quot;&gt;US strikes on Iran ran a second day; the S&amp;amp;P fell &lt;strong&gt;&amp;minus;1.6%&lt;/strong&gt; and the Nasdaq &lt;strong&gt;&amp;minus;2%&lt;/strong&gt; on 10 Jun as Iran retaliated against US facilities in Bahrain, Jordan and Kuwait. Brent climbed above &lt;strong&gt;$96&lt;/strong&gt; with the Strait of Hormuz near-closed; US crude inventories fell 7.2M bbl, a 7th straight weekly draw.&lt;/p&gt;
  &lt;table role=&quot;presentation&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; border=&quot;0&quot; width=&quot;100%&quot; style=&quot;margin:0 0 22px 0;&quot;&gt;&lt;tr&gt;&lt;td width=&quot;3&quot; bgcolor=&quot;#0B1B3F&quot; style=&quot;background-color:#0B1B3F;width:3px;line-height:1px;font-size:1px;&quot;&gt;&amp;nbsp;&lt;/td&gt;&lt;td style=&quot;padding:2px 0 2px 14px;&quot;&gt;&lt;p style=&quot;font-family:&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;font-size:14px;color:#3A3F47;margin:0;line-height:1.55;&quot;&gt;&lt;strong style=&quot;color:#0B1B3F;&quot;&gt;Portfolio impact:&lt;/strong&gt; Risk-off flows favored defensives; the oil spike reopens the inflation question the curve had started to close. FOMC 16&amp;ndash;17 June ahead.&lt;/p&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;

  &lt;h2 style=&quot;font-size:24px;font-weight:700;color:#0B1B3F;margin:0 0 24px 0;line-height:1.25;&quot;&gt;The Headlines That Moved the Tape&lt;/h2&gt;

  &lt;p style=&quot;font-size:14px;color:#3A3F47;margin:0 0 10px 0;line-height:1.55;&quot;&gt;US strikes on Iran ran a second day on 10 June; the S&amp;amp;P fell &lt;strong&gt;&amp;minus;1.6%&lt;/strong&gt; and the Nasdaq &lt;strong&gt;&amp;minus;2%&lt;/strong&gt; as Iran retaliated against US facilities in Bahrain, Jordan and Kuwait. Brent jumped above &lt;strong&gt;~$96&lt;/strong&gt; with the Strait of Hormuz near-closed, and US crude stocks fell 7.2M bbl, a seventh straight draw. Risk-off flows favored defensives.&lt;/p&gt;
  &lt;table role=&quot;presentation&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; border=&quot;0&quot; width=&quot;100%&quot; style=&quot;margin:0 0 22px 0;&quot;&gt;&lt;tr&gt;

  &lt;/tr&gt;&lt;/table&gt;
  &lt;h3 style=&quot;font-size:16px;font-weight:700;color:#0B1B3F;margin:0 0 10px 0;&quot;&gt;CPI Runs Hot at 4.2%, but Core Cools to 2.9%&lt;/h3&gt;
  &lt;p style=&quot;font-size:14px;color:#3A3F47;margin:0 0 10px 0;line-height:1.55;&quot;&gt;May CPI rose &lt;strong&gt;+0.5% MoM / +4.2% YoY&lt;/strong&gt;, the hottest since April 2023, with energy roughly 60% of the rise. Core cooled to &lt;strong&gt;+0.2% MoM / +2.9% YoY&lt;/strong&gt;, below the 0.3% estimate. Higher-for-longer stays intact into the 16&amp;ndash;17 June FOMC.&lt;/p&gt;
  &lt;table role=&quot;presentation&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; border=&quot;0&quot; width=&quot;100%&quot; style=&quot;margin:0 0 22px 0;&quot;&gt;&lt;tr&gt;
